name: Build Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          ls -la
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d projeto
          DIR=$(dirname "$(find projeto -name build.gradle -not -path '*/node_modules/*' | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: valdorianrpg-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
